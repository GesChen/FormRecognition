<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pipeline debug viewer</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/theme.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .toolbar label { color: var(--muted); font-size: 12px; }
    .toolbar input[type="number"] {
      width: 72px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }
    .toolbar input[type="text"] {
      width: 220px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 12px;
      cursor: pointer;
      background: var(--accent);
      color: var(--on-accent);
    }
    .btn:hover { background: var(--accent-h); }
    .btn.secondary { background: var(--secondary-btn); }
    .btn.secondary:hover { background: var(--secondary-btn-hover); }
    .status { font-size: 12px; color: var(--muted); max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tabs {
      display: flex;
      gap: 4px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .tabs button {
      padding: 8px 14px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-size: 12px;
    }
    .tabs button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .panel {
      flex: 1;
      overflow: auto;
      padding: 12px;
      display: none;
    }
    .panel.active { display: block; }
    #tree-root { line-height: 1.45; }
    .row { margin: 2px 0; }
    .indent { margin-left: 18px; border-left: 1px solid var(--border); padding-left: 8px; }
    .key { color: var(--key); }
    .str { color: var(--str); white-space: pre-wrap; word-break: break-word; }
    .lit { color: var(--num); }
    .null { color: var(--null); }
    .bool { color: var(--bool); }
    summary {
      cursor: pointer;
      user-select: none;
      color: var(--muted);
    }
    summary:hover { color: var(--text); }
    details { margin: 2px 0; }
    #raw-json {
      width: 100%;
      height: calc(100vh - 140px);
      min-height: 200px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      font-family: inherit;
      font-size: 12px;
      resize: vertical;
    }
    input[type="file"] { display: none; }
    .hint { font-size: 11px; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <input type="file" id="file-debug" accept=".json,application/json" />
  <input type="file" id="file-recognition" accept=".json,application/json" />
  <div class="toolbar">
    <button type="button" class="btn" id="btn-pick-debug">Debug JSON…</button>
    <span class="status" id="debug-path-label">No file</span>
    <label>Item <input type="number" id="item-index" min="0" value="0" /></label>
    <button type="button" class="btn secondary" id="btn-pick-recognition">Recognition JSON…</button>
    <span class="status" id="recognition-label">(none)</span>
    <button type="button" class="btn" id="btn-load">Load slice</button>
    <span class="status" id="msg"></span>
  </div>
  <div class="tabs">
    <button type="button" class="active" data-panel="tree">Tree view</button>
    <button type="button" data-panel="raw">Raw JSON</button>
  </div>
  <div class="main">
    <div class="panel active" id="panel-tree">
      <div>
        <button type="button" class="btn secondary" id="btn-expand">Expand all</button>
        <button type="button" class="btn secondary" id="btn-collapse">Collapse all</button>
      </div>
      <div id="tree-root"></div>
    </div>
    <div class="panel" id="panel-raw">
      <textarea id="raw-json" readonly spellcheck="false"></textarea>
    </div>
  </div>
  <p class="hint">
    Hierarchical tree (like an XML/JSON inspector): open <code>*_debug.json</code> from <code>output/recognition/</code>, pick item index (same order as <code>items[]</code> in the recognition output), then Load slice.
  </p>

<script>
(function () {
  "use strict";

  let selectedDebugRel = "";
  let selectedRecognitionRel = "";
  const fileDebug = document.getElementById("file-debug");
  const fileRecognition = document.getElementById("file-recognition");

  const treeRoot = document.getElementById("tree-root");
  const rawJson = document.getElementById("raw-json");
  const msg = document.getElementById("msg");

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderTree(value, key, depth) {
    const d = depth === undefined ? 0 : depth;
    const keyHtml = key !== undefined
      ? '<span class="key">' + escapeHtml(String(key)) + "</span>: "
      : "";

    if (value === null) {
      return '<span class="row">' + keyHtml + '<span class="null">null</span></span>';
    }
    const t = typeof value;
    if (t === "number" || t === "bigint") {
      return '<span class="row">' + keyHtml + '<span class="lit">' + String(value) + "</span></span>";
    }
    if (t === "boolean") {
      return '<span class="row">' + keyHtml + '<span class="bool">' + String(value) + "</span></span>";
    }
    if (t === "string") {
      return '<span class="row">' + keyHtml + '<span class="str">"' + escapeHtml(value) + '"</span></span>';
    }
    if (Array.isArray(value)) {
      if (value.length === 0) {
        return '<span class="row">' + keyHtml + '<span class="lit">[]</span></span>';
      }
      const open = d < 2;
      const inner = value.map(function (v, i) {
        return '<div class="indent">' + renderTree(v, i, d + 1) + "</div>";
      }).join("");
      return (
        '<details' + (open ? " open" : "") + ' class="row">' +
        "<summary>" + keyHtml + "Array(" + value.length + ")</summary>" +
        inner +
        "</details>"
      );
    }
    if (t === "object") {
      const keys = Object.keys(value);
      if (keys.length === 0) {
        return '<span class="row">' + keyHtml + '<span class="lit">{}</span></span>';
      }
      const open = d < 2;
      const inner = keys.map(function (k) {
        return '<div class="indent">' + renderTree(value[k], k, d + 1) + "</div>";
      }).join("");
      return (
        '<details' + (open ? " open" : "") + ' class="row">' +
        "<summary>" + keyHtml + "{" + keys.length + " keys}</summary>" +
        inner +
        "</details>"
      );
    }
    return '<span class="row">' + keyHtml + '<span class="str">' + escapeHtml(String(value)) + "</span></span>";
  }

  let lastData = null;

  function showData(data) {
    lastData = data;
    treeRoot.innerHTML = renderTree(data, undefined, 0);
    rawJson.value = JSON.stringify(data, null, 2);
  }

  document.getElementById("btn-expand").addEventListener("click", function () {
    treeRoot.querySelectorAll("details").forEach(function (el) { el.open = true; });
  });
  document.getElementById("btn-collapse").addEventListener("click", function () {
    treeRoot.querySelectorAll("details").forEach(function (el) { el.open = false; });
  });

  document.querySelectorAll(".tabs button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".tabs button").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      var id = btn.getAttribute("data-panel");
      document.querySelectorAll(".panel").forEach(function (p) {
        p.classList.toggle("active", p.id === "panel-" + id);
      });
    });
  });

  async function uploadJsonFile(file, isDebug) {
    if (!file) return;
    msg.textContent = "Uploading " + file.name + "\u2026";
    var fd = new FormData();
    fd.append("file", file);
    try {
      var res = await fetch("/api/upload-json", { method: "POST", body: fd });
      var info = await res.json().catch(function () { return {}; });
      if (!res.ok || !info.ok) {
        msg.textContent = info.error || ("Upload failed (" + res.status + ")");
        return;
      }
      if (isDebug) {
        selectedDebugRel = info.path;
        document.getElementById("debug-path-label").textContent = info.filename;
        fetchMeta();
      } else {
        selectedRecognitionRel = info.path;
        document.getElementById("recognition-label").textContent = info.filename;
        msg.textContent = "Recognition file: " + info.filename;
      }
    } catch (err) {
      msg.textContent = "Upload failed: " + String(err);
    }
  }

  function fetchMeta() {
    if (!selectedDebugRel) return;
    msg.textContent = "Loading meta…";
    fetch("/api/debug-meta?path=" + encodeURIComponent(selectedDebugRel))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) {
          msg.textContent = data.error;
          return;
        }
        var imax = data.item_index_max != null ? data.item_index_max : 0;
        document.getElementById("item-index").max = imax;
        document.getElementById("item-index").value = 0;
        msg.textContent = data.pdf_stem + " — " + (data.item_count || 0) + " items";
      })
      .catch(function () { msg.textContent = "Meta failed"; });
  }

  document.getElementById("btn-pick-debug").addEventListener("click", function () { fileDebug.click(); });
  document.getElementById("btn-pick-recognition").addEventListener("click", function () { fileRecognition.click(); });
  fileDebug.addEventListener("change", function () {
    var f = fileDebug.files && fileDebug.files[0];
    if (f) { uploadJsonFile(f, true); try { fileDebug.value = ""; } catch (e) {} }
  });
  fileRecognition.addEventListener("change", function () {
    var f = fileRecognition.files && fileRecognition.files[0];
    if (f) { uploadJsonFile(f, false); try { fileRecognition.value = ""; } catch (e) {} }
  });

  document.getElementById("btn-load").addEventListener("click", function () {
    if (!selectedDebugRel) {
      msg.textContent = "Pick a debug JSON first.";
      return;
    }
    var itemIndex = parseInt(document.getElementById("item-index").value, 10);
    if (isNaN(itemIndex) || itemIndex < 0) {
      msg.textContent = "Invalid item index.";
      return;
    }
    var body = {
      path: selectedDebugRel,
      item_index: itemIndex
    };
    if (selectedRecognitionRel) body.recognition_path = selectedRecognitionRel;

    msg.textContent = "Loading…";
    fetch("/api/slice", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.error) {
          msg.textContent = res.error;
          return;
        }
        msg.textContent = "OK — item " + (res.data && res.data.meta ? res.data.meta.item_index : "");
        showData(res.data);
      })
      .catch(function () { msg.textContent = "Request failed"; });
  });
})();
</script>
</body>
</html>
